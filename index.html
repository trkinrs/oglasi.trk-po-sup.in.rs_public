<!doctype html>
<html lang="sr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Veslački ljudi — oprema za veslanje, blizu tebe</title><meta name="description" content="Lokalna pijaca za kajake, kanue, SUP daske, čamce na vesla i opremu za veslanje."><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/main.css"></head>
<body>

<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
  const cards=[...document.querySelectorAll('.listing-card')];
  const searchInput=document.querySelector('#search-input');
  const index=lunr(function(){this.ref('id');this.field('title');this.field('description');this.field('kind');this.field('type');this.field('subtype');this.field('brand');this.field('condition');this.field('location');cards.forEach(card=>this.add({id:card.dataset.id,title:card.dataset.title,description:card.dataset.description,kind:card.dataset.kind,type:card.dataset.type,subtype:card.dataset.subtype,brand:card.dataset.brand,condition:card.dataset.condition,location:card.dataset.location}))});
  function syncUrl(){const params=new URLSearchParams();const query=searchInput.value.trim();const required=[...document.querySelectorAll('[data-presence-for]:checked')].map(input=>input.dataset.presenceFor);if(query)params.set('search',query);if(required.length)params.set('required',required.join(','));const suffix=params.toString();history.replaceState(null,'',`${location.pathname}${suffix?`?${suffix}`:''}${location.hash}`)}
  const resultOne="oglas";const resultMany="oglasa";function applySearch(){const query=searchInput.value.trim();const matches=query?new Set(index.search(query).map(result=>result.ref)):new Set(cards.map(card=>card.dataset.id));cards.forEach(card=>{card.hidden=!matches.has(card.dataset.id)});const count=cards.filter(card=>!card.hidden).length;document.querySelector('#result-count').textContent=`${count} ${count===1?resultOne:resultMany}`;document.querySelector('#empty-state').hidden=count!==0;syncUrl()}
  const queryParts=value=>value.match(/(?:\+?[^\s"]+:"[^"]*"|\+?[^\s]+)/g)||[];const presenceFor=field=>document.querySelector(`[data-presence-for="${field}"]`);const normalizeQuery=rawQuery=>{if(!rawQuery)return '';const query=rawQuery.includes(' ')?rawQuery.replace(/^([^:]+):(.+)$/,'$1:"$2"'):rawQuery;const field=query.split(':',1)[0].replace(/^\+/,'');return presenceFor(field)?.checked?`+${query.replace(/^\+/,'')}`:query.replace(/^\+/,'')};const updateFilterStates=()=>{const parts=queryParts(searchInput.value);document.querySelectorAll('[data-query]').forEach(item=>item.classList.toggle('is-active',parts.includes(normalizeQuery(item.dataset.query))))};
  document.querySelectorAll('[data-query]').forEach(button=>button.addEventListener('click',()=>{if(!button.dataset.query){searchInput.value='';document.querySelectorAll('[data-presence-for]').forEach(input=>{input.checked=false});updateFilterStates();applySearch();return}const query=normalizeQuery(button.dataset.query);const parts=queryParts(searchInput.value.trim());const index=parts.indexOf(query);if(index>-1)parts.splice(index,1);else parts.push(query);searchInput.value=parts.join(' ');updateFilterStates();applySearch()}));
  document.querySelectorAll('[data-presence-for]').forEach(input=>input.addEventListener('change',()=>{const field=input.dataset.presenceFor;const parts=queryParts(searchInput.value).map(part=>{const plain=part.replace(/^\+/,'');return plain.startsWith(`${field}:`)?(input.checked?`+${plain}`:plain):part});searchInput.value=parts.join(' ');updateFilterStates();applySearch()}));
  const moreFilters=document.querySelector('#more-filters');const advancedFilters=document.querySelector('#advanced-filters');const kindRow=advancedFilters?.querySelector('.filter-row');if(kindRow&&!kindRow.querySelector('[data-presence-for="kind"]')){const kindPresence=document.createElement('label');kindPresence.className='filter-presence';kindPresence.innerHTML='<input type="checkbox" data-presence-for="kind"> Obavezno';kindRow.appendChild(kindPresence)}moreFilters?.addEventListener('click',()=>{const open=advancedFilters.hidden;advancedFilters.hidden=!open;moreFilters.setAttribute('aria-expanded',String(open));moreFilters.textContent=open?'Sakrij filtere':'Još filtera'});
  searchInput.addEventListener('input',()=>{updateFilterStates();applySearch()});
  const urlParams=new URLSearchParams(location.search);if(urlParams.get('search'))searchInput.value=urlParams.get('search');(urlParams.get('required')||'').split(',').filter(Boolean).forEach(field=>{const input=document.querySelector(`[data-presence-for="${field}"]`);if(input)input.checked=true});if(/(?:kind|brand|subtype|condition):/.test(urlParams.get('search')||'')||urlParams.get('required')){advancedFilters.hidden=false;moreFilters.setAttribute('aria-expanded','true');moreFilters.textContent='Sakrij filtere'};if(searchInput.value||urlParams.get('required')){updateFilterStates();applySearch()}
</script>
</body></html>
